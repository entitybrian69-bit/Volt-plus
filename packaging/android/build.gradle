plugins { id 'com.android.application' version '8.11.1' }

// The permanent release key, when the caller has it (CI reads it from the
// ANDROID_KEYSTORE_BASE64 secret). Without it, builds keep the development key.
def releaseKeyStore = System.getenv('HORIZON_ANDROID_KEYSTORE')
def releaseKeyStorePassword = System.getenv('HORIZON_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('HORIZON_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('HORIZON_ANDROID_KEY_PASSWORD')
def hasReleaseKey = releaseKeyStore && releaseKeyStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'dev.horizon.android'
    compileSdk 35
    defaultConfig {
        applicationId providers.gradleProperty('appId').getOrElse('vp.net.voltplus')
        manifestPlaceholders = [appLabel: providers.gradleProperty('appLabel').getOrElse('Volt Plus')]
        minSdk providers.gradleProperty('minSdk').getOrElse('26').toInteger()
        targetSdk 35
        versionCode providers.gradleProperty('releaseVersionCode').orElse(providers.gradleProperty('devVersionCode')).getOrElse('30').toInteger()
        versionName '1.0' + (providers.gradleProperty('devVersionCode').isPresent() ? (providers.gradleProperty('appId').getOrNull()?.endsWith('.debug') ? '-debug.' : '-dev.') + providers.gradleProperty('devBuild').get() : '')
        ndk { abiFilters providers.gradleProperty('abi').get() }
    }
    signingConfigs {
        development {
            storeFile file('../../.local/android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
        if (hasReleaseKey) {
            releaseKey {
                storeFile file(releaseKeyStore)
                storePassword releaseKeyStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig hasReleaseKey ? signingConfigs.releaseKey : signingConfigs.development
            if (!providers.gradleProperty('devVersionCode').isPresent()) {
                versionNameSuffix '-debug.' + providers.gradleProperty('devBuild').getOrElse('local')
            }
            if (providers.gradleProperty('useDevSuffix').isPresent()) { applicationIdSuffix '.dev' }
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            // The permanent key lets one APK update the previous install in place
            // (Android needs the same certificate and a higher versionCode).
            // Only the public certificate enters the APK; the key never does.
            signingConfig hasReleaseKey ? signingConfigs.releaseKey : signingConfigs.development
        }
    }
    buildFeatures { aidl true }
    sourceSets.main {
        java.srcDirs = ['java']
        aidl.srcDirs = ['aidl']
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['../../.local/android/gradle-jni']
        assets.srcDirs = ['../../.local/android/gradle-assets', 'media']
        res.srcDirs = ['res']
    }
    androidResources { noCompress += ['mp4'] }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
}
layout.buildDirectory = file('../../.local/android/gradle-build')

// This is an opt-in build probe, not a feature switch: there is no shipping
// Java control overlay or editor yet. Do not enable in published APKs.
if (providers.gradleProperty('experimentalJavaControls').orNull == 'true') {
    dependencies { implementation project(':layer') }
}
